<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề Cương Của Bố Đinh Việt Phương - Lớp 7 Vuốt Màn Hình</title>
    <style>
        * { box-sizing: border-box; }

        @keyframes rainbowGlow {
            0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 15px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 15px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f6f9;
            color: #111111;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            border: 5px solid #ff0000;
            animation: rainbowGlow 0.3s infinite linear;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            color: #111;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            font-size: 13px;
            font-weight: bold;
        }

        .tiktok-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 18px;
            background-color: #000000;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            border: 2px solid #ff0000;
            font-size: 13px;
        }

        /* Hướng dẫn vuốt màn hình */
        .swipe-guide {
            text-align: center;
            background: #e8f4fd;
            color: #0056b3;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 15px;
            border: 1px dashed #b8daff;
        }

        /* Khu vực trượt ngang (Slider) */
        .slider-container {
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .slider-track {
            display: flex;
            transition: transform 0.4s ease-in-out;
            width: 100%;
        }

        .slide-card {
            min-width: 100%;
            box-sizing: border-box;
            padding: 5px;
        }

        /* Nút chuyển trang qua lại */
        .slider-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 0 10px;
        }

        .nav-arrow {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-arrow:active {
            background-color: #ff0000;
        }

        .page-indicator {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        /* Nội dung bên trong mỗi môn học */
        h2.subject-header {
            background-color: #e9ecef;
            color: #000;
            padding: 10px 15px;
            border-left: 6px solid #007bff;
            margin-top: 0;
            font-size: 17px;
        }

        .box {
            background-color: #f8f9fa;
            border: 1px solid #cccccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .box-title {
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 8px;
            font-size: 14px;
        }

        ul.options { list-style-type: none; padding-left: 0; }
        ul.options li { padding: 3px 0; font-size: 14px; }

        .correct-answer {
            color: #008000;
            font-weight: bold;
            background-color: #e2f0d9;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px dashed #008000;
            display: inline-block;
        }

        .essay-box {
            background-color: #fffde7;
            border-left: 4px solid #f1c40f;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>

    <header>

        <div class="subtitle">LỚP 7 - GIỮA KỲ 1 (TẤT
